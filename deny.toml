[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unlicense", "CC0-1.0", "BSL-1.0", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.9
unused-allowed-license = "allow"     # the allow-list is policy, not every licence is present yet
private = { ignore = true }           # our crates: publish = false, license UNLICENSED until OWN-01

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true           # path deps between workspace crates are not "*"
# Do NOT set [graph] exclude-unpublished = true: every crate here is unpublished.

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (no vulnerability); compile-time macro pulled by specta/tauri-specta
    # for IPC codegen (D-09). Revisit when specta 2.0 final drops it. docs/08 §3, D-09.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build-time only, via specta (D-09)" },
    # `zip` 4.x via tauri-plugin-updater: SUID/SGID bits and symlinks during `extract()` — Unix
    # behaviour. On Windows the updater downloads the signed NSIS installer, verifies the minisign
    # signature first and runs it; no ZIP is extracted. Revisit when the plugin moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "unix SUID/SGID on zip extract; windows NSIS path never extracts zips (updater)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract symlinks; not used on windows, artifacts are signature-checked (updater)" },
    { id = "RUSTSEC-2026-0369", reason = "zip unix permissions via symlinks; not used on windows (updater)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[graph]
targets = ["x86_64-pc-windows-msvc"]   # Windows-only app (FR-PLT-001): Linux-only GTK deps (RUSTSEC-2024-0370) are out of graph
