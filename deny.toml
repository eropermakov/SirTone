[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unlicense", "CC0-1.0", "BSL-1.0", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016",
         # D-143 (hub signing): BlueOak — minicbor/apple-codesign; CDLA-Permissive — webpki-roots data.
         "BlueOak-1.0.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"     # the allow-list is policy, not every licence is present yet
private = { ignore = true }           # our crates: publish = false, license UNLICENSED until OWN-01

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true           # path deps between workspace crates are not "*"
# Do NOT set [graph] exclude-unpublished = true: every crate here is unpublished.

[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0459 (bundled SQLite < 3.54): a crafted database + sibling -wal file with a
    # different page size can leak stale memory when OPENED. The fix is libsqlite3-sys >= 0.39
    # (rusqlite 0.41), but rusqlite_migration 2.6 (latest) still needs rusqlite 0.40 and Cargo
    # allows one `links = "sqlite3"`. SirTone opens only its own library database in the app data
    # folder, never a file received from someone else. Revisit when rusqlite_migration supports 0.41.
    { id = "RUSTSEC-2026-0459", reason = "needs a crafted db+wal pair; we open only our own DB; blocked by rusqlite_migration 2.6 on rusqlite 0.40" },
    # `paste` is unmaintained (no vulnerability); compile-time macro pulled by specta/tauri-specta
    # for IPC codegen (D-09). Revisit when specta 2.0 final drops it. docs/08 §3, D-09.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build-time only, via specta (D-09)" },
    # `zip` 4.x via tauri-plugin-updater: SUID/SGID bits and symlinks during `extract()` — Unix
    # behaviour. On Windows the updater downloads the signed NSIS installer, verifies the minisign
    # signature first and runs it; no ZIP is extracted. Revisit when the plugin moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "unix SUID/SGID on zip extract; windows NSIS path never extracts zips (updater)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract symlinks; not used on windows, artifacts are signature-checked (updater)" },
    { id = "RUSTSEC-2026-0369", reason = "zip unix permissions via symlinks; not used on windows (updater)" },
    # Same path: a symlink entry's declared size aborts `extract()` (denial of service, no memory
    # unsafety). Fixed in zip 9.0; the updater still pins 4.x and never extracts on Windows.
    { id = "RUSTSEC-2026-0429", reason = "zip extract symlink size abort; windows NSIS path never extracts zips (updater)" },
    # D-143 — the hub's iPhone signing (sirtone-devicelink: isideload + apple-codesign). The key
    # signs locally; nothing decrypts or signs for a network peer, so timing leaks have no oracle.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing: local code signing only, no network oracle (D-143)" },
    { id = "RUSTSEC-2026-0387", reason = "elliptic-curve timing: local code signing only, no network oracle (D-143)" },
    # `object` parses only the Mach-O we built ourselves; zstd sections never come from strangers.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd OOM via object: parses only our own app binary (D-143)" },
    { id = "RUSTSEC-2020-0095", reason = "difference unmaintained: apple-codesign internal diffing (D-143)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained: via apple-codesign tungstenite (D-143)" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained: apple-codesign config parsing, unused path (D-143)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[graph]
targets = ["x86_64-pc-windows-msvc"]   # Windows-only app (FR-PLT-001): Linux-only GTK deps (RUSTSEC-2024-0370) are out of graph
