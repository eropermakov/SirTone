[package]
name = "sirtone-audio"
description = "Decoding, resampling, DSP, mixer, automix, WASAPI output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sirtone-core.workspace = true
symphonia.workspace = true
symphonia-adapter-libopus.workspace = true
rubato.workspace = true
opusic-sys.workspace = true
ogg.workspace = true
rtrb.workspace = true
rustfft.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# Output (WASAPI), Media Foundation (WMA) and the engine thread are Windows-only; decoders and
# DSP build everywhere — the phones reuse them (stage 8, D-137; the phone output is the
# platform's own: AVAudioSourceNode / AAudio).
[target.'cfg(windows)'.dependencies]
wasapi.workspace = true
windows = { workspace = true, features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Performance",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
sirtone-core.workspace = true
