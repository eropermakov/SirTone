[package]
name = "sirtone-mobile-ffi"
description = "UniFFI facade of the shared core for the phone apps (Swift, Kotlin) — D-137, M1.4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
# staticlib → iOS xcframework; cdylib → Android .so and binding generation; lib → tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# `cargo run -p sirtone-mobile-ffi --features bindgen --bin uniffi-bindgen -- generate …`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
sirtone-core = { workspace = true }
sirtone-library = { workspace = true }
sirtone-wave = { workspace = true }
sirtone-audio = { workspace = true }
rtrb = { workspace = true }
rusqlite = { workspace = true }
uniffi = { workspace = true }
thiserror = { workspace = true }
