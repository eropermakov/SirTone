[package]
# Same name and version as the crate isideload 0.5.2 depends on: the root `[patch.crates-io]`
# swaps this in. Our own code over `apple-codesign` (MPL-2.0) — no LGPL in the binary (D-143).
name = "apple-codesign-quick"
version = "0.1.0"
description = "SirTone shim: the bundle-signing interface isideload uses, on apple-codesign (D-143)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
apple-codesign = { version = "=0.29.0", default-features = false }
cryptographic-message-syntax = "0.27"
x509-certificate = "0.24"
plist = "1"
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = "0.2"
thiserror = { workspace = true }
