[workspace]
resolver = "3"
# 11 crates sirtone-* + apps/desktop/src-tauri (sirtone-app, the only crate that knows Tauri).
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["spikes/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"       # until OWN-01
publish = false
authors = ["Sir.kov Studio"]

[workspace.dependencies]     # versions checked 2026-10-15 (docs/08 §5.1)
sirtone-core = { path = "crates/sirtone-core" }
sirtone-audio = { path = "crates/sirtone-audio" }
sirtone-platform = { path = "crates/sirtone-platform" }
sirtone-library = { path = "crates/sirtone-library" }
sirtone-recognize = { path = "crates/sirtone-recognize" }
sirtone-playback = { path = "crates/sirtone-playback" }
tauri = { version = "2.12", features = [] }
tauri-build = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3", "aiff", "caf"] }
symphonia-adapter-libopus = "0.3"
wasapi = "0.26"
rubato = "5.0"
rtrb = "0.4"
ebur128 = "0.1.10"
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
windows = { version = "0.62", features = [] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1.28", features = ["v7", "serde"] }
blake3 = "1.8"
trash = "5.2"
encoding_rs = "0.8.42"
crossbeam-channel = "0.5"
parking_lot = "0.12"
arc-swap = "1.9"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "gzip"] }
proptest = "1.12"
insta = "1.49"
criterion = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
large_futures = "warn"

[profile.dev.package."*"]
opt-level = 2                # decoders/DSP optimised even in debug, otherwise audio stutters

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"             # needed for catch_unwind around decoders (Tauri template uses abort)
strip = "symbols"
