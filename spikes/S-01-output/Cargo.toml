[package]
name = "s01-output"
version = "0.1.0"
edition = "2024"
publish = false
description = "S-01: вывод WASAPI shared event-driven, MMCSS, underrun-счётчик, проверка loopback (docs/09 §4, D-05)"

# Самостоятельный проект вне workspace приложения.
[workspace]

[dependencies]
wasapi = "0.26"
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3", "aiff", "caf"] }
rubato = "5.0"
rtrb = "0.4"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = 3
debug = false
