[package]
# Same name and version as the crate isideload 0.5.2 depends on, so `[patch.crates-io]` swaps it in.
# Our own code over `apple-codesign` (MPL-2.0): no LGPL in the binary (D-143).
name = "apple-codesign-quick"
version = "0.1.0"
edition = "2024"
publish = false
description = "SirTone shim: the bundle-signing interface isideload uses, implemented on apple-codesign (D-143)"

[dependencies]
apple-codesign = { version = "=0.29.0", default-features = false }
cryptographic-message-syntax = "0.27"
x509-certificate = "0.24"
plist = "1"
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = "0.2"
thiserror = "2"
