[package]
name = "s04-viz"
version = "0.1.0"
edition = "2024"
publish = false

# Самостоятельный проект вне workspace приложения.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
panic = "unwind"
